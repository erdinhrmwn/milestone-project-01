<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Football Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Admin Panel</h1>
            <a href="../index.html" class="text-sm bg-red-600 px-3 py-1 rounded-sm hover:bg-red-700">Logout</a>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
        <div class="flex flex-col justify-between items-center mb-6">
            <div class="w-full flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Manage Players</h2>
                <button onclick="toggleAddForm()"
                    class="bg-green-600 text-white px-4 py-2 rounded-sm hover:bg-green-700 font-semibold">+ Add New
                    Player</button>
            </div>

            <div id="addPlayerForm" class="w-full hidden mb-8 p-6 bg-gray-50 rounded-lg border border-gray-200">
                <h3 class="text-lg font-bold mb-4">Add New Player</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Name</label>
                        <input id="newPlayerName" type="text" class="w-full border rounded-sm p-2"
                            placeholder="Lionel Messi">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Position</label>
                        <select id="newPlayerPosition" class="w-full border rounded-sm p-2">
                            <option value="FW">FW</option>
                            <option value="MF">MF</option>
                            <option value="DF">DF</option>
                            <option value="GK">GK</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Nationality</label>
                        <input id="newPlayerNationality" type="text" class="w-full border rounded-sm p-2"
                            placeholder="Argentina">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Image URL</label>
                        <input id="newPlayerImage" type="text" class="w-full border rounded-sm p-2"
                            placeholder="https://placehold.co/150">
                    </div>
                </div>
                <div class="mt-4 flex space-x-2">
                    <button onclick="submitNewPlayer()"
                        class="bg-blue-600 text-white px-4 py-2 rounded-sm hover:bg-blue-700">Save Player</button>
                    <button onclick="toggleAddForm()"
                        class="bg-gray-400 text-white px-4 py-2 rounded-sm hover:bg-gray-500">Cancel</button>
                </div>
            </div>

            <div class="w-full overflow-x-auto">
                <table class="w-full text-left border-collapse border border-gray-300">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 border border-gray-300">ID</th>
                            <th class="p-3 border border-gray-300">Name</th>
                            <th class="p-3 border border-gray-300">Position</th>
                            <th class="p-3 border border-gray-300">Nationality</th>
                            <th class="p-3 border border-gray-300 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../players.js"></script>
    <script>
        const tableBody = document.getElementById('playerTableBody');
        const addForm = document.getElementById('addPlayerForm');

        function renderTable() {
            const currentPlayers = getAvailablePlayers();
            tableBody.innerHTML = '';

            currentPlayers.forEach(player => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-3 border border-gray-300 text-center font-mono text-sm">${player.id}</td>
                    <td class="p-3 border border-gray-300 font-medium">${player.name}</td>
                    <td class="p-3 border border-gray-300">${player.position}</td>
                    <td class="p-3 border border-gray-300">${player.nationality}</td>
                    <td class="p-3 border border-gray-300 text-center space-x-2">
                        <button onclick="handleDelete(${player.id})" class="text-red-600 hover:underline font-medium">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function toggleAddForm() {
            addForm.classList.toggle('hidden');
        }

        function submitNewPlayer() {
            // Get input data
            const name = document.getElementById('newPlayerName').value;
            const position = document.getElementById('newPlayerPosition').value;
            const nationality = document.getElementById('newPlayerNationality').value;
            const image = document.getElementById('newPlayerImage').value;

            // Add new player
            addPlayer(name, position, nationality, image);

            // Re-render the table
            renderTable();

            // Clear inputs
            document.getElementById('newPlayerName').value = '';
            document.getElementById('newPlayerPosition').value = '';
            document.getElementById('newPlayerNationality').value = '';
            document.getElementById('newPlayerImage').value = '';

            // Hide form
            toggleAddForm();
        }

        function handleDelete(id) {
            if (confirm('Are you sure you want to delete this player?')) {
                deletePlayer(id);
                renderTable();
            }
        }

        // Initial render
        renderTable();
    </script>
</body>

</html>
