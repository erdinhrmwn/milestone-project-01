<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 pb-20">
    <nav class="w-full bg-[#e50027] p-4 text-white sticky top-0 shadow-md z-50">
        <div class="container mx-auto grid grid-cols-[1fr_auto_1fr] items-center">
            <div class="justify-self-start">
                <a href="index.html" class="text-xl font-bold">Football Cards</a>
            </div>
            <div class="justify-self-center flex justify-between items-center space-x-5 lg:block hidden">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="players.html" class="font-semibold hover:underline">Players</a>
                <a href="reward.html" class="hover:underline">Reward</a>
                <a href="tutorial.html" class="hover:underline">Tutorial</a>
                <a href="about.html" class="hover:underline">About</a>
            </div>
            <div class="justify-self-end lg:block hidden">
                <a href="admin/login.html"
                    class="bg-white text-black border border-[#e50027] px-4 py-2 rounded hover:bg-white hover:underline">Admin
                    Login</a>
            </div>
        </div>
    </nav>

    <!-- Mobile Navbar -->
    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center p-4 z-50 lg:hidden">
        <a href="index.html" class="flex flex-col items-center text-gray-600 hover:text-[#e50027]">
            <span class="text-2xl">🏠</span>
            <span class="text-xs">Home</span>
        </a>
        <a href="players.html" class="flex flex-col items-center text-[#e50027]">
            <span class="text-2xl">👥</span>
            <span class="text-xs">Players</span>
        </a>
        <a href="reward.html" class="flex flex-col items-center text-gray-600 hover:text-[#e50027]">
            <span class="text-2xl">🎁</span>
            <span class="text-xs">Reward</span>
        </a>
        <a href="tutorial.html" class="flex flex-col items-center text-gray-600 hover:text-[#e50027]">
            <span class="text-2xl">📖</span>
            <span class="text-xs">Tutorial</span>
        </a>
        <a href="about.html" class="flex flex-col items-center text-gray-600 hover:text-[#e50027]">
            <span class="text-2xl">ℹ️</span>
            <span class="text-xs">About</span>
        </a>
        <a href="admin/login.html" class="flex flex-col items-center text-gray-600 hover:text-[#e50027]">
            <span class="text-2xl">🔐</span>
            <span class="text-xs">Admin</span>
        </a>
    </nav>

    <main class="container mx-auto mt-10 p-6">
        <h1 class="text-3xl font-bold mb-6 text-center text-[#e50027]">Available Players</h1>
        <div id="playerGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script src="players.js"></script>
    <script src="favorites.js"></script>
    <script>
        const playerGrid = document.getElementById('playerGrid');

        function renderPlayers() {
            const players = getAvailablePlayers();
            playerGrid.innerHTML = '';

            players.forEach(player => {
                const favoriteStatus = isFavorite(player.id);

                playerGrid.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow hover:shadow-xl transition relative">
                        <div class="w-full h-48 bg-gray-200 rounded mb-4 overflow-hidden flex items-center justify-center">
                            <img src="${player.image}" alt="${player.name}" class="object-cover w-full h-full">
                        </div>
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-xl font-bold">${player.name}</h2>
                                <p class="text-[#e50027] font-semibold">${player.position} - ${player.nationality}</p>
                            </div>
                            <button onclick="handleFavorite(${player.id})" class="text-2xl focus:outline-none transition transform hover:scale-110">
                                ${favoriteStatus ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function handleFavorite(playerId) {
            toggleFavorite(playerId);
            renderPlayers(); // Re-render to update icons
        }

        // Initial render
        renderPlayers();
    </script>
</body>

</html>
