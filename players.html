<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Football Card Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 pb-8">
    <!-- Desktop Navbar -->
    <nav class="w-full bg-[#e50027] p-4 text-white sticky top-0 border-b-2 border-black z-50">
        <div class="container mx-auto grid grid-cols-[1fr_auto_1fr] items-center">
            <div class="justify-self-start">
                <a href="index.html" class="text-xl font-black uppercase tracking-tighter italic">Football Cards</a>
            </div>
            <div class="justify-self-center flex justify-between items-center space-x-8 lg:block hidden">
                <a href="index.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Home</a>
                <a href="players.html" class="font-bold border-b-4 border-white pb-1">Players</a>
                <a href="reward.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Reward</a>
                <a href="tutorial.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Tutorial</a>
                <a href="about.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">About</a>
            </div>
            <div class="justify-self-end lg:block hidden">
                <a href="admin/login.html"
                    class="bg-white text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold text-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">Admin
                    Login</a>
            </div>
        </div>
    </nav>

    <!-- Mobile Navbar -->
    <nav
        class="fixed bottom-0 left-0 w-full bg-white border-t-2 border-black flex justify-around items-center p-4 z-50 lg:hidden">
        <a href="index.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">🏠</span>
            <span class="text-xs uppercase tracking-widest">Home</span>
        </a>
        <a href="players.html" class="flex flex-col items-center text-[#e50027] font-bold">
            <span class="text-2xl">👥</span>
            <span class="text-xs uppercase tracking-widest">Players</span>
        </a>
        <a href="reward.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">🎁</span>
            <span class="text-xs uppercase tracking-widest">Reward</span>
        </a>
        <a href="tutorial.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">📖</span>
            <span class="text-xs uppercase tracking-widest">Tutorial</span>
        </a>
        <a href="about.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">ℹ️</span>
            <span class="text-xs uppercase tracking-widest">About</span>
        </a>
        <a href="admin/login.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">🔐</span>
            <span class="text-xs uppercase tracking-widest">Admin</span>
        </a>
    </nav>

    <main class="container mx-auto mt-10 pb-20">
        <!-- Players Hero Section -->
        <section
            class="md:p-10 p-6 mx-6 md:mx-0 bg-[#e50027] border-2 border-black rounded-2xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] text-center mb-10 text-white">
            <h1 class="text-4xl font-black mb-3 uppercase tracking-tighter italic">The Elite Gallery</h1>
            <p class="text-lg max-w-2xl mx-auto font-medium text-red-50">
                Explore the most complete collection of football talent.<br />Manage your favorites and build your
                ultimate deck.
            </p>
        </section>

        <!-- Search & Filter (UI Only) -->
        <div class="px-6 md:px-0 mb-10 flex flex-col md:flex-row gap-4 justify-center items-center">
            <div class="relative w-full md:w-[400px]">
                <input id="searchInput" type="text" placeholder="Search players by name..."
                    class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-black focus:ring-0 focus:outline-none shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] font-bold text-base placeholder:text-gray-400">
                <span class="absolute left-3.5 top-3.5 text-xl">🔍</span>
            </div>
        </div>

        <div id="playerGrid"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 px-6 md:px-0 pb-12">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script src="scripts/players.js"></script>
    <script src="scripts/favorites.js"></script>
    <script>
        const playerGrid = document.getElementById('playerGrid');
        const searchInput = document.getElementById('searchInput');

        let availablePlayers = getAvailablePlayers();

        searchInput.onkeyup = () => {
            let inputVal = searchInput.value.toLowerCase();

            if (!inputVal) {
                renderPlayerGrid(availablePlayers);
                return;
            }

            let filteredPlayers = availablePlayers.filter(player => player.name.toLowerCase().includes(inputVal));
            renderPlayerGrid(filteredPlayers);
        }

        function handleFavorite(playerId) {
            toggleFavorite(playerId);

            availablePlayers = getAvailablePlayers();
            renderPlayerGrid(availablePlayers);
        }

        function renderPlayerGrid(players) {
            playerGrid.innerHTML = '';

            players.forEach(player => {
                const favoriteStatus = isFavorite(player.id);

                playerGrid.innerHTML += `
                    <div class="group bg-white rounded-2xl overflow-hidden shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all duration-300 border-2 border-black flex flex-col hover:-translate-x-1 hover:-translate-y-1">
                        <div class="relative h-64 bg-gray-50 overflow-hidden border-b-2 border-black">
                            <img src="${player.image}" alt="${player.name}" class="object-cover w-full h-full transform group-hover:scale-110 transition-transform duration-500">
                            <button onclick="handleFavorite(${player.id})" 
                                class="absolute top-3 right-3 bg-white border-2 border-black w-10 h-10 rounded-xl flex items-center justify-center shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] transition-all z-10">
                                <span class="text-xl transition-transform active:scale-125">${favoriteStatus ? '❤️' : '🤍'}</span>
                            </button>
                        </div>
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div class="flex items-center gap-2 mb-2.5">
                                <span class="px-2 py-0.5 text-black text-[10px] font-black border-2 border-black rounded uppercase tracking-widest">${player.position}</span>
                                <span class="text-gray-900 font-bold text-[10px] uppercase tracking-tighter"># ${player.nationality}</span>
                            </div>
                            <h2 class="text-2xl font-black text-gray-900 group-hover:text-[#e50027] transition-colors mb-1 uppercase tracking-tighter italic">${player.name}</h2>
                        </div>
                    </div>
                `;
            });
        }

        // Initial render
        renderPlayerGrid(availablePlayers);
    </script>
</body>

</html>
