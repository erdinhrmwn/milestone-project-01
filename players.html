<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Football Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold">Football Cards</a>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="players.html" class="hover:underline">Players</a>
                <a href="reward.html" class="hover:underline">Reward</a>
                <a href="tutorial.html" class="hover:underline">Tutorial</a>
                <a href="about.html" class="hover:underline">About</a>
                <a href="admin/login.html" class="bg-blue-800 px-3 py-1 rounded hover:bg-blue-900">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-6">
        <h1 class="text-3xl font-bold mb-6 text-center">Available Players</h1>
        <div id="playerGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script src="players.js"></script>
    <script src="favorites.js"></script>
    <script>
        const playerGrid = document.getElementById('playerGrid');

        function renderPlayers() {
            const players = getAvailablePlayers();
            playerGrid.innerHTML = '';

            players.forEach(player => {
                const favoriteStatus = isFavorite(player.id);

                playerGrid.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow hover:shadow-xl transition relative">
                        <div class="w-full h-48 bg-gray-200 rounded mb-4 overflow-hidden flex items-center justify-center">
                            <img src="${player.image}" alt="${player.name}" class="object-cover w-full h-full">
                        </div>
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-xl font-bold">${player.name}</h2>
                                <p class="text-blue-600 font-semibold">${player.position} - ${player.nationality}</p>
                            </div>
                            <button onclick="handleFavorite(${player.id})" class="text-2xl focus:outline-none transition transform hover:scale-110">
                                ${favoriteStatus ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function handleFavorite(playerId) {
            toggleFavorite(playerId);
            renderPlayers(); // Re-render to update icons
        }

        // Initial render
        renderPlayers();
    </script>
</body>

</html>
