<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.min.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 pb-8">
    <!-- Desktop Navbar -->
    <nav class="w-full bg-[#e50027] p-4 text-white sticky top-0 border-b-2 border-black z-50">
        <div class="container mx-auto grid grid-cols-[1fr_auto_1fr] items-center">
            <div class="justify-self-start">
                <a href="index.html" class="text-xl font-black uppercase tracking-tighter italic">Football Cards</a>
            </div>
            <div class="justify-self-center flex justify-between items-center space-x-8 lg:block hidden">
                <a href="index.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Home</a>
                <a href="players.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Players</a>
                <a href="reward.html" class="font-bold border-b-4 border-white pb-1">Reward</a>
                <a href="tutorial.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Tutorial</a>
                <a href="about.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">About</a>
                <a href="contact.html" class="font-bold hover:border-b-4 border-white pb-1 transition-all">Contact</a>
            </div>
            <div class="justify-self-end lg:block hidden">
                <a href="admin/login.html"
                    class="bg-white text-black border-2 border-black px-4 py-1.5 rounded-lg font-bold text-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">Admin
                    Login</a>
            </div>
        </div>
    </nav>

    <!-- Mobile Navbar -->
    <nav
        class="fixed bottom-0 left-0 w-full bg-white border-t-2 border-black flex justify-around items-center p-4 z-50 lg:hidden">
        <a href="index.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">🏠</span>
            <span class="text-xs uppercase tracking-widest">Home</span>
        </a>
        <a href="players.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">👥</span>
            <span class="text-xs uppercase tracking-widest">Players</span>
        </a>
        <a href="reward.html" class="flex flex-col items-center text-[#e50027] font-bold">
            <span class="text-2xl">🎁</span>
            <span class="text-xs uppercase tracking-widest">Reward</span>
        </a>
        <a href="tutorial.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">📖</span>
            <span class="text-xs uppercase tracking-widest">Tutorial</span>
        </a>
        <a href="about.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">ℹ️</span>
            <span class="text-xs uppercase tracking-widest">About</span>
        </a>
        <a href="contact.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">📧</span>
            <span class="text-xs uppercase tracking-widest">Contact</span>
        </a>
        <a href="admin/login.html" class="flex flex-col items-center text-gray-600 font-bold">
            <span class="text-2xl">🔐</span>
            <span class="text-xs uppercase tracking-widest">Admin</span>
        </a>
    </nav>

    <main class="container mx-auto mt-6 md:mt-10 pb-20">
        <!-- About Hero Section -->
        <section
            class="md:p-10 p-6 mx-6 md:mx-0 bg-[#e50027] border-2 border-black rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-center mb-10 text-white">
            <h1 class="text-3xl font-black mb-3 uppercase tracking-tighter italic">Shuffle & Win</h1>
            <p class="text-lg max-w-2xl mx-auto font-medium text-red-50">
                Pull a legendary player for your
                collection!
            </p>
        </section>

        <!-- Reward Hero / Shuffle Section -->
        <section class="max-w-4xl mx-auto px-6 md:px-0">
            <div
                class="bg-white rounded-[40px] shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] overflow-hidden border-2 border-black">
                <div class="p-6 md:p-8 text-center flex flex-col items-center bg-yellow-50">
                    <!-- Notification Area -->
                    <div id="rewardNotification"
                        class="h-16 mb-6 md:h-20 md:mb-8 flex items-center justify-center text-center">
                        <p class="text-lg md:text-xl font-black text-gray-700 uppercase italic opacity-50">
                            Waiting for shuffle...
                        </p>
                    </div>

                    <!-- The Card Container -->
                    <div class="relative group">
                        <div id="rewardCard"
                            class="w-44 h-64 md:w-56 md:h-80 bg-white rounded-3xl mx-auto mb-10 flex items-center justify-center text-gray-900 text-5xl md:text-7xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] border-2 border-black transition-all duration-500 overflow-hidden relative group-hover:-translate-x-1 group-hover:-translate-y-1 group-hover:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
                            ?
                        </div>
                    </div>

                    <button id="shuffleBtn"
                        class="bg-[#e50027] text-white px-8 py-4 md:px-12 md:py-5 rounded-2xl font-black text-xl md:text-2xl border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all disabled:opacity-50 disabled:cursor-not-allowed uppercase tracking-tighter italic">
                        Start Shuffle
                    </button>
                </div>
            </div>
        </section>

        <!-- Recent Rewards History -->
        <section class="max-w-4xl mx-auto mt-16 px-6 md:px-0">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Recent Pulls</h2>
                <span class="text-sm text-gray-500">Your latest luck history</span>
            </div>

            <div id="rewardHistories" class="flex flex-col space-y-4">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <script src="scripts/players.js"></script>
    <script src="scripts/favorites.js"></script>
    <script>
        dayjs.extend(window.dayjs_plugin_relativeTime);

        const availablePlayers = getAvailablePlayers();
        const rewardHistories = [];

        const shuffleBtn = document.getElementById('shuffleBtn');
        const rewardCard = document.getElementById('rewardCard');
        const historiesContainer = document.getElementById('rewardHistories');
        const rewardNotification = document.getElementById('rewardNotification');

        function renderHistories() {
            if (rewardHistories.length === 0) {
                historiesContainer.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm text-center border-2 border-black text-gray-400 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                        No pulls recorded yet. Start shuffling!
                    </div>`;
                return;
            }

            historiesContainer.innerHTML = rewardHistories.map(player => `
                <div class="bg-white p-5 rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition border-2 border-black flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-20 bg-gray-50 rounded-xl overflow-hidden border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                            <img src="${player.image}" alt="${player.name}" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h3 class="text-md font-black text-gray-900 uppercase tracking-tighter italic">${player.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="px-2 py-0.5 bg-red-100 text-[#e50027] text-[10px] font-black border-2 border-[#e50027] rounded uppercase tracking-widest">${player.position}</span>
                                <span class="text-[10px] text-gray-500 font-bold uppercase">• ${player.nationality}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-gray-400 uppercase font-black tracking-widest mt-1">${dayjs(player.timestamp).fromNow()}</p>
                    </div>
                </div>
            `).join('');
        }

        shuffleBtn.addEventListener('click', () => {
            let selectedPlayer = null;
            shuffleBtn.disabled = true;
            rewardNotification.innerHTML = '<p class="text-lg font-bold text-[#e50027] animate-pulse">Shuffling the deck...</p>';

            rewardCard.classList.remove('border-dashed', 'border-gray-200');
            rewardCard.classList.add('border-solid', 'border-black', 'scale-105');

            let animate = setInterval(() => {
                selectedPlayer = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];
                rewardCard.innerHTML = `<img src="${selectedPlayer.image}" alt="${selectedPlayer.name}" class="object-cover w-full h-full animate-pulse">`;
            }, 100);

            setTimeout(() => {
                clearInterval(animate);

                rewardCard.innerHTML = `<img src="${selectedPlayer.image}" alt="${selectedPlayer.name}" class="object-cover w-full h-full transform transition-transform duration-700 hover:scale-110">`;
                rewardCard.classList.remove('scale-105');

                rewardNotification.innerHTML = `
                    <div class="animate-bounce">
                        <p class="text-xl font-extrabold text-gray-900">Congrats! You got ${selectedPlayer.name}!</p>
                        <p class="text-sm text-green-600 font-bold uppercase tracking-widest">Added to history</p>
                    </div>`;

                rewardHistories.unshift({
                    id: rewardHistories.length + 1,
                    name: selectedPlayer.name,
                    position: selectedPlayer.position,
                    nationality: selectedPlayer.nationality,
                    image: selectedPlayer.image,
                    timestamp: new Date().toISOString()
                });

                renderHistories();

                setTimeout(() => {
                    shuffleBtn.disabled = false;
                }, 1000);
            }, 4000);
        });

        renderHistories();
    </script>
</body>

</html>
